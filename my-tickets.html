<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Tickets - Dr.Orn IT Helpdesk</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px 10px;
      color: #777;
    }

    .error {
      background: #fff1f1;
      border: 1px solid #ffcccc;
      color: #c62828;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
      word-break: break-word;
    }

    .summary {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .ticket {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .ticket-id {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .row {
      margin: 6px 0;
      line-height: 1.5;
    }

    .label {
      color: #777;
      display: inline-block;
      min-width: 100px;
    }

    .problem {
      margin-top: 12px;
      padding: 12px;
      background: #f7f7f7;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .resolution {
      margin-top: 10px;
      padding: 12px;
      background: #eef8ee;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-open {
      background: #fff3cd;
      color: #856404;
    }

    .status-progress {
      background: #cfe8ff;
      color: #075985;
    }

    .status-pending {
      background: #eee;
      color: #555;
    }

    .status-resolved {
      background: #dff5e1;
      color: #26733b;
    }

    .status-closed {
      background: #d9f2df;
      color: #176b2c;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 14px;
      color: #777;
    }

    .refresh {
      width: 100%;
      border: 0;
      background: #222;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 Ticket ของฉัน</h1>

  <div class="subtitle">
    Dr.Orn IT Helpdesk
  </div>

  <div id="loading" class="loading">
    กำลังโหลดข้อมูล...
  </div>

  <div id="error"></div>

  <div id="content"></div>

</div>

<script>

const LIFF_ID =
  '2011909669-olKYnktd';

const API_URL =
  'https://drorn-it-helpdesk-webhook.nattima-p.workers.dev';

let currentUserId = '';


/* =====================================================
   INIT
===================================================== */

async function init() {

  try {

    document.getElementById('loading').style.display =
      'block';

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }

    const profile =
      await liff.getProfile();

    currentUserId =
      profile.userId;

    console.log(
      'LINE User ID:',
      currentUserId
    );

    await loadTickets();

  }
  catch (error) {

    console.error(error);

    showError(
      'เกิดข้อผิดพลาดตอนเปิดระบบ<br><br>' +
      escapeHtml(error.message || String(error))
    );

  }

}


/* =====================================================
   LOAD TICKETS
===================================================== */

async function loadTickets() {

  try {

    document.getElementById('loading').style.display =
      'block';

    document.getElementById('error').innerHTML =
      '';

    document.getElementById('content').innerHTML =
      '';

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body: JSON.stringify({
            action: 'myTickets',
            lineUserId: currentUserId
          })
        }
      );

    const rawText =
      await response.text();

    console.log(
      'WORKER RAW RESPONSE:',
      rawText
    );

    if (!rawText) {

      throw new Error(
        'Worker ไม่ส่ง Response กลับมา'
      );

    }


    /* =================================================
       PARSE WORKER RESPONSE
    ================================================= */

    let workerResult;

    try {

      workerResult =
        JSON.parse(rawText);

    }
    catch (e) {

      console.error(
        'Invalid JSON:',
        rawText
      );

      throw new Error(
        'Worker Response ไม่ใช่ JSON'
      );

    }


    console.log(
      'WORKER RESULT:',
      workerResult
    );


    /* =================================================
       FIND ACTUAL APPS SCRIPT RESULT
    ================================================= */

    let result = null;


    // กรณี Worker ส่ง:
    // { data: { ok:true, tickets:[] } }

    if (
      workerResult &&
      workerResult.data &&
      typeof workerResult.data === 'object'
    ) {

      result =
        workerResult.data;

    }


    // กรณี Worker ส่ง:
    // { appsScriptResponse: "..." }

    else if (
      workerResult &&
      workerResult.appsScriptResponse
    ) {

      if (
        typeof workerResult.appsScriptResponse ===
        'string'
      ) {

        try {

          result =
            JSON.parse(
              workerResult.appsScriptResponse
            );

        }
        catch (e) {

          throw new Error(
            'Apps Script Response ไม่ใช่ JSON'
          );

        }

      }
      else {

        result =
          workerResult.appsScriptResponse;

      }

    }


    // กรณี Worker ส่ง Apps Script Response
    // มาโดยตรง

    else if (
      workerResult &&
      Array.isArray(workerResult.tickets)
    ) {

      result =
        workerResult;

    }


    // กรณี response ซ้อนอีกชั้น
    // เช่น { body: "..." }

    else if (
      workerResult &&
      workerResult.body
    ) {

      if (
        typeof workerResult.body ===
        'string'
      ) {

        try {

          result =
            JSON.parse(
              workerResult.body
            );

        }
        catch (e) {

          throw new Error(
            'Body จาก Apps Script ไม่ใช่ JSON'
          );

        }

      }
      else {

        result =
          workerResult.body;

      }

    }


    /* =================================================
       VALIDATE RESULT
    ================================================= */

    if (!result) {

      console.error(
        'ไม่พบ Apps Script Response:',
        workerResult
      );

      throw new Error(
        'ไม่พบ Apps Script Response'
      );

    }


    console.log(
      'FINAL RESULT:',
      result
    );


    if (result.ok === false) {

      throw new Error(
        result.error ||
        result.message ||
        'Apps Script แจ้งข้อผิดพลาด'
      );

    }


    if (
      !Array.isArray(
        result.tickets
      )
    ) {

      throw new Error(
        'ไม่พบข้อมูล Ticket ใน Response'
      );

    }


    renderTickets(
      result.tickets
    );

  }
  catch (error) {

    console.error(
      'loadTickets error:',
      error
    );

    showError(
      escapeHtml(
        error.message ||
        String(error)
      )
    );

  }
  finally {

    document.getElementById('loading').style.display =
      'none';

  }

}


/* =====================================================
   RENDER TICKETS
===================================================== */

function renderTickets(tickets) {

  const content =
    document.getElementById('content');


  if (
    !tickets ||
    tickets.length === 0
  ) {

    content.innerHTML = `
      <div class="empty">
        <div style="font-size:40px;">📭</div>
        <h3>ยังไม่มี Ticket</h3>
        <div>
          ยังไม่พบ Ticket ที่สร้างจาก LINE Account นี้
        </div>
      </div>
    `;

    return;

  }


  let html = `

    <div class="summary">
      📋 พบ Ticket ทั้งหมด
      ${tickets.length}
      รายการ
    </div>

  `;


  tickets.forEach(function(ticket) {

    html += createTicketCard(
      ticket
    );

  });


  html += `

    <button
      class="refresh"
      onclick="loadTickets()"
    >
      🔄 โหลดข้อมูลใหม่
    </button>

  `;


  content.innerHTML =
    html;

}


/* =====================================================
   TICKET CARD
===================================================== */

function createTicketCard(ticket) {

  const status =
    String(
      ticket.status || ''
    );

  const statusClass =
    getStatusClass(status);


  return `

    <div class="ticket">

      <div class="ticket-id">
        🎫 ${escapeHtml(
          ticket.ticketId || '-'
        )}
      </div>

      <div class="row">
        <span class="label">
          วันที่:
        </span>
        ${formatDate(
          ticket.createdAt
        )}
      </div>

      <div class="row">
        <span class="label">
          สาขา:
        </span>
        ${escapeHtml(
          ticket.branch || '-'
        )}
      </div>

      <div class="row">
        <span class="label">
          หมวดหมู่:
        </span>
        ${escapeHtml(
          ticket.category || '-'
        )}
      </div>

      <div class="row">
        <span class="label">
          Priority:
        </span>
        ${escapeHtml(
          ticket.priority || '-'
        )}
      </div>

      <div class="row">
        <span class="label">
          สถานะ:
        </span>

        <span class="status ${statusClass}">
          ${escapeHtml(
            status || '-'
          )}
        </span>
      </div>

      <div class="row">
        <span class="label">
          ผู้รับผิดชอบ:
        </span>
        ${escapeHtml(
          ticket.assignee || '-'
        )}
      </div>

      <div class="row">
        <span class="label">
          SLA Due:
        </span>
        ${formatDate(
          ticket.slaDue
        )}
      </div>

      <div class="problem">

        <strong>
          ปัญหา
        </strong>

        <br>

        ${escapeHtml(
          ticket.problem || '-'
        )}

      </div>


      ${
        ticket.resolution
          ? `

            <div class="resolution">

              <strong>
                วิธีแก้ไข
              </strong>

              <br>

              ${escapeHtml(
                ticket.resolution
              )}

            </div>

          `
          : ''
      }


      ${
        ticket.satisfaction
          ? `

            <div class="row"
                 style="margin-top:12px;">

              <span class="label">
                คะแนน:
              </span>

              ⭐ ${escapeHtml(
                ticket.satisfaction
              )}

            </div>

          `
          : ''
      }

    </div>

  `;

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status) {

  switch (
    String(status)
      .toLowerCase()
  ) {

    case 'open':
      return 'status-open';

    case 'in progress':
      return 'status-progress';

    case 'pending':
      return 'status-pending';

    case 'resolved':
      return 'status-resolved';

    case 'closed':
      return 'status-closed';

    default:
      return 'status-pending';

  }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value) {

  if (!value) {
    return '-';
  }

  try {

    const date =
      new Date(value);

    if (
      isNaN(
        date.getTime()
      )
    ) {

      return escapeHtml(
        String(value)
      );

    }

    return date.toLocaleString(
      'th-TH',
      {
        dateStyle: 'medium',
        timeStyle: 'short'
      }
    );

  }
  catch (e) {

    return escapeHtml(
      String(value)
    );

  }

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  document.getElementById('loading').style.display =
    'none';

  document.getElementById('error').innerHTML = `

    <div class="error">

      ❌ ${message}

      <br><br>

      <button
        class="refresh"
        onclick="loadTickets()"
      >
        🔄 ลองใหม่
      </button>

    </div>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return '';

  }

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
