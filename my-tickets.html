<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    เคสของฉัน - Dr.Orn IT Helpdesk
  </title>

  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f5f5f5;

      color: #222;

    }


    .container {

      max-width: 700px;

      margin: auto;

    }


    .header {

      background: #222;

      color: white;

      border-radius: 16px;

      padding: 22px;

      margin-bottom: 16px;

    }


    .header h1 {

      margin: 0 0 8px;

      font-size: 22px;

    }


    .header p {

      margin: 0;

      font-size: 14px;

      opacity: .85;

    }


    .refresh {

      width: 100%;

      border: 0;

      border-radius: 12px;

      padding: 13px;

      margin-bottom: 16px;

      background: #222;

      color: white;

      font-size: 15px;

      cursor: pointer;

    }


    .refresh:active {

      transform: scale(.98);

    }


    .ticket {

      background: white;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 14px;

      box-shadow:
        0 2px 8px rgba(0,0,0,.06);

    }


    .ticket-header {

      display: flex;

      justify-content: space-between;

      gap: 10px;

      align-items: center;

      margin-bottom: 14px;

    }


    .ticket-id {

      font-weight: bold;

      font-size: 15px;

    }


    .status {

      padding: 6px 10px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;

      white-space: nowrap;

    }


    .open {

      background: #fff3cd;

      color: #856404;

    }


    .progress {

      background: #dbeafe;

      color: #1d4ed8;

    }


    .pending {

      background: #ffedd5;

      color: #c2410c;

    }


    .resolved {

      background: #dcfce7;

      color: #15803d;

    }


    .closed {

      background: #e5e7eb;

      color: #374151;

    }


    .row {

      font-size: 14px;

      margin: 8px 0;

      line-height: 1.5;

    }


    .label {

      color: #777;

    }


    .problem {

      background: #f8f8f8;

      padding: 12px;

      border-radius: 10px;

      margin-top: 12px;

      font-size: 14px;

      line-height: 1.5;

    }


    .message {

      background: white;

      border-radius: 16px;

      padding: 30px 20px;

      text-align: center;

    }


    .error {

      color: #b91c1c;

    }


    .summary {

      background: white;

      border-radius: 12px;

      padding: 14px;

      margin-bottom: 14px;

      font-size: 14px;

    }


    .debug {

      background: #fff3cd;

      border: 1px solid #ffe69c;

      border-radius: 12px;

      padding: 14px;

      margin-top: 14px;

      font-size: 12px;

      word-break: break-word;

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =================================================
       HEADER
  ================================================== -->

  <div class="header">

    <h1>
      📋 เคสของฉัน
    </h1>

    <p id="userName">
      กำลังเชื่อมต่อ LINE...
    </p>

  </div>


  <!-- =================================================
       REFRESH
  ================================================== -->

  <button
    class="refresh"
    onclick="loadTickets()"
  >

    🔄 รีเฟรชรายการเคส

  </button>


  <!-- =================================================
       CONTENT
  ================================================== -->

  <div id="content">

    <div class="message">

      กำลังโหลด...

    </div>

  </div>


</div>


<script>


/* =====================================================
   CONFIG
===================================================== */

const LIFF_ID =
  '2011909669-olKYnktd';


const API_URL =
  'https://drorn-it-helpdesk-webhook.nattima-p.workers.dev';


let currentUserId = '';



/* =====================================================
   INIT LIFF
===================================================== */

async function init() {

  try {


    document
      .getElementById('userName')
      .textContent =
        'กำลังเริ่มต้น LIFF...';


    await liff.init({

      liffId:
        LIFF_ID

    });


    document
      .getElementById('userName')
      .textContent =
        'LIFF เริ่มต้นสำเร็จ กำลังตรวจสอบบัญชี...';


    /*
     * ================================================
     * ตรวจสอบ Login
     * ================================================
     */

    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    /*
     * ================================================
     * อ่าน Profile
     * ================================================
     */

    const profile =
      await liff.getProfile();


    currentUserId =
      profile.userId;


    document
      .getElementById('userName')
      .textContent =
        'สวัสดีคุณ ' +
        (
          profile.displayName ||
          ''
        );


    /*
     * ================================================
     * โหลด Ticket
     * ================================================
     */

    await loadTickets();


  } catch (error) {


    console.error(
      'LIFF INIT ERROR:',
      error
    );


    showError(
      error
    );

  }

}



/* =====================================================
   LOAD TICKETS
===================================================== */

async function loadTickets() {


  if (!currentUserId) {

    showError(
      new Error(
        'ไม่พบ LINE User ID'
      )
    );

    return;

  }


  const content =
    document.getElementById(
      'content'
    );


  content.innerHTML =

    '<div class="message">' +

      'กำลังโหลดรายการ Ticket...' +

    '</div>';


  try {


    /*
     * ================================================
     * Request
     * ================================================
     */

    const payload = {

      action:
        'myTickets',

      lineUserId:
        currentUserId

    };


    console.log(
      'MY TICKETS REQUEST:',
      payload
    );


    /*
     * ================================================
     * Call Worker
     * ================================================
     */

    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify(
              payload
            ),

          redirect:
            'follow'

        }

      );


    /*
     * ================================================
     * อ่าน Response
     * ================================================
     */

    const text =
      await response.text();


    console.log(
      'MY TICKETS RAW RESPONSE:',
      text
    );


    /*
     * ================================================
     * Parse Worker JSON
     * ================================================
     */

    let workerResult;


    try {

      workerResult =
        JSON.parse(
          text
        );

    } catch (error) {

      throw new Error(
        'Worker ไม่ได้ส่ง JSON ที่ถูกต้อง'
      );

    }


    console.log(
      'WORKER RESULT:',
      workerResult
    );


    /*
     * ================================================
     * ตรวจสอบ Worker
     * ================================================
     */

    if (
      workerResult.ok !== true
    ) {

      throw new Error(

        workerResult.error ||

        'Worker แจ้งข้อผิดพลาด'

      );

    }


    /*
     * ================================================
     * Worker รุ่นใหม่
     *
     * {
     *   ok: true,
     *   data: {
     *      ok: true,
     *      count: 11,
     *      tickets: [...]
     *   }
     * }
     * ================================================
     */

    let result;


    if (
      workerResult.data &&
      typeof workerResult.data ===
        'object'
    ) {

      result =
        workerResult.data;

    }


    /*
     * ================================================
     * Fallback
     *
     * รองรับ Worker รุ่นเก่า
     * ================================================
     */

    else if (
      workerResult.appsScriptResponse
    ) {


      try {

        result =
          JSON.parse(
            workerResult
              .appsScriptResponse
          );

      } catch (error) {

        throw new Error(
          'Apps Script Response ไม่ใช่ JSON ที่สมบูรณ์'
        );

      }

    }


    /*
     * ================================================
     * กรณี Worker ส่ง Result ตรง
     * ================================================
     */

    else {

      result =
        workerResult;

    }


    console.log(
      'FINAL MY TICKETS RESULT:',
      result
    );


    /*
     * ================================================
     * ตรวจสอบ Result
     * ================================================
     */

    if (!result) {

      throw new Error(
        'ไม่ได้รับข้อมูล Ticket'
      );

    }


    if (
      result.ok !== true
    ) {

      throw new Error(

        result.error ||

        'Apps Script แจ้งข้อผิดพลาด'

      );

    }


    /*
     * ================================================
     * Render
     * ================================================
     */

    renderResult(
      result
    );


  } catch (error) {


    console.error(
      'MY TICKETS ERROR:',
      error
    );


    showError(
      error
    );

  }

}



/* =====================================================
   RENDER RESULT
===================================================== */

function renderResult(
  result
) {


  const content =
    document.getElementById(
      'content'
    );


  const tickets =
    Array.isArray(
      result.tickets
    )

      ? result.tickets

      : [];


  /*
   * ================================================
   * ไม่มี Ticket
   * ================================================
   */

  if (
    tickets.length === 0
  ) {


    content.innerHTML = `

      <div class="message">

        <div
          style="font-size:42px"
        >
          📭
        </div>

        <strong>
          ยังไม่มี Ticket
        </strong>

        <p
          style="color:#777"
        >
          ระบบเชื่อมต่อ API สำเร็จ<br>
          แต่ยังไม่พบ Ticket
          ของ LINE Account นี้
        </p>

      </div>


      <div class="debug">

        <strong>
          🔎 API RESPONSE
        </strong>

        <br><br>

        count:
        ${
          escapeHtml(
            result.count ??
            0
          )
        }

      </div>

    `;


    return;

  }


  /*
   * ================================================
   * Summary
   * ================================================
   */

  let html = `

    <div class="summary">

      📋 พบ Ticket ทั้งหมด

      <strong>
        ${
          tickets.length
        }
      </strong>

      รายการ

    </div>

  `;


  /*
   * ================================================
   * Ticket Cards
   * ================================================
   */

  html +=

    tickets
      .map(
        createTicketCard
      )
      .join('');


  content.innerHTML =
    html;

}



/* =====================================================
   CREATE TICKET CARD
===================================================== */

function createTicketCard(
  ticket
) {


  const status =
    ticket.status ||
    '-';


  return `

    <div class="ticket">


      <div class="ticket-header">


        <div class="ticket-id">

          🎫

          ${
            escapeHtml(
              ticket.ticketId
            )
          }

        </div>


        <div
          class="status ${
            getStatusClass(
              status
            )
          }"
        >

          ${
            getStatusText(
              status
            )
          }

        </div>


      </div>


      <div class="row">

        <span class="label">
          📅 วันที่แจ้ง:
        </span>

        ${
          escapeHtml(
            formatDate(
              ticket.createdAt
            )
          )
        }

      </div>


      <div class="row">

        <span class="label">
          🏥 สาขา:
        </span>

        ${
          escapeHtml(
            ticket.branch
          )
        }

      </div>


      <div class="row">

        <span class="label">
          📂 ประเภท:
        </span>

        ${
          escapeHtml(
            ticket.category
          )
        }

      </div>


      <div class="row">

        <span class="label">
          ⚠️ Priority:
        </span>

        ${
          escapeHtml(
            ticket.priority
          )
        }

      </div>


      <div class="row">

        <span class="label">
          👨‍💻 ผู้รับผิดชอบ:
        </span>

        ${
          escapeHtml(
            ticket.assignee ||
            '-'
          )
        }

      </div>


      <div class="row">

        <span class="label">
          ⏰ SLA Due:
        </span>

        ${
          escapeHtml(
            formatDate(
              ticket.slaDue
            )
          )
        }

      </div>


      <div class="problem">

        <strong>
          📝 ปัญหา
        </strong>

        <br><br>

        ${
          escapeHtml(
            ticket.problem
          )
        }

      </div>


      ${
        ticket.resolution

          ? `

            <div class="problem">

              <strong>
                🔧 วิธีแก้ไข
              </strong>

              <br><br>

              ${
                escapeHtml(
                  ticket.resolution
                )
              }

            </div>

          `

          : ''
      }


      ${
        ticket.satisfaction

          ? `

            <div
              class="row"
              style="margin-top:14px"
            >

              <span class="label">
                ⭐ ความพึงพอใจ:
              </span>

              ${
                escapeHtml(
                  ticket.satisfaction
                )
              }/5

            </div>

          `

          : ''
      }


    </div>

  `;

}



/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
  status
) {


  switch (
    status
  ) {


    case 'Open':

      return 'open';


    case 'In Progress':

      return 'progress';


    case 'Pending':

      return 'pending';


    case 'Resolved':

      return 'resolved';


    case 'Closed':

      return 'closed';


    default:

      return 'closed';

  }

}



/* =====================================================
   STATUS TEXT
===================================================== */

function getStatusText(
  status
) {


  switch (
    status
  ) {


    case 'Open':

      return '🟡 เปิดเคส';


    case 'In Progress':

      return '🔵 กำลังดำเนินการ';


    case 'Pending':

      return '🟠 รอดำเนินการ';


    case 'Resolved':

      return '🟢 แก้ไขแล้ว';


    case 'Closed':

      return '✅ ปิดแล้ว';


    default:

      return status || '-';

  }

}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  value
) {


  if (!value) {

    return '-';

  }


  const date =
    new Date(
      value
    );


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return String(
      value
    );

  }


  return date.toLocaleString(

    'th-TH',

    {

      day:
        '2-digit',

      month:
        '2-digit',

      year:
        'numeric',

      hour:
        '2-digit',

      minute:
        '2-digit'

    }

  );

}



/* =====================================================
   SHOW ERROR
===================================================== */

function showError(
  error
) {


  const message =
    error &&
    error.message

      ? error.message

      : String(
          error
        );


  document
    .getElementById(
      'content'
    )
    .innerHTML = `

      <div class="message">

        <div
          style="font-size:40px"
        >
          ⚠️
        </div>

        <strong
          class="error"
        >
          เกิดข้อผิดพลาด
        </strong>

        <p>
          ${
            escapeHtml(
              message
            )
          }
        </p>

      </div>

    `;

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {


  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}



/* =====================================================
   START
===================================================== */

init();


</script>


</body>

</html>
