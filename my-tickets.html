<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>เคสของฉัน - Dr.Orn IT Helpdesk</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: #222;
      color: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
      opacity: .85;
    }

    .refresh {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 16px;
      background: #222;
      color: white;
      font-size: 15px;
    }

    .ticket {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .ticket-id {
      font-weight: bold;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }

    .open {
      background: #fff3cd;
      color: #856404;
    }

    .progress {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pending {
      background: #ffedd5;
      color: #c2410c;
    }

    .resolved {
      background: #dcfce7;
      color: #15803d;
    }

    .closed {
      background: #e5e7eb;
      color: #374151;
    }

    .row {
      font-size: 14px;
      margin: 8px 0;
    }

    .label {
      color: #777;
    }

    .problem {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
    }

    .debug {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      font-size: 12px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📋 เคสของฉัน</h1>
    <p id="userName">กำลังเชื่อมต่อ LINE...</p>
  </div>

  <button class="refresh" onclick="loadTickets()">
    🔄 รีเฟรชรายการเคส
  </button>

  <div id="content">
    <div class="message">
      กำลังโหลด...
    </div>
  </div>

</div>

<script>

const LIFF_ID = '2011909669-olKYnktd';

document.getElementById('userName').textContent =
  'กำลังเริ่มต้น LIFF...';

const API_URL =
  'https://drorn-it-helpdesk-webhook.nattima-p.workers.dev';

let currentUserId = '';

/* =====================================================
   INIT
===================================================== */

async function init() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile =
      await liff.getProfile();

    currentUserId =
      profile.userId;

    document.getElementById('userName').textContent =
      'สวัสดีคุณ ' +
      (profile.displayName || '');

    await loadTickets();

  } catch (error) {

    showError(error);

  }

}


/* =====================================================
   LOAD
===================================================== */

async function loadTickets() {

  if (!currentUserId) {
    return;
  }

  const content =
    document.getElementById('content');

  content.innerHTML =
    '<div class="message">กำลังโหลดรายการ Ticket...</div>';

  try {

    const payload = {

      action: 'myTickets',

      lineUserId:
        currentUserId

    };

    console.log(
      'MY TICKETS REQUEST:',
      payload
    );

    const response =
      await fetch(API_URL, {

        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(payload),

        redirect:
          'follow'

      });

    const text =
      await response.text();

    console.log(
      'MY TICKETS RAW RESPONSE:',
      text
    );

    let result;

    try {

      result =
        JSON.parse(text);

    } catch (error) {

      throw new Error(
        'API ไม่ได้ส่ง JSON กลับมา: ' +
        text.substring(0, 500)
      );

    }

    console.log(
      'MY TICKETS RESULT:',
      result
    );

    renderResult(result);

  } catch (error) {

    showError(error);

  }

}


/* =====================================================
   RENDER RESULT
===================================================== */

function renderResult(result) {

  const content =
    document.getElementById('content');

  if (!result) {

    showError(
      new Error('ไม่ได้รับข้อมูลจาก API')
    );

    return;

  }

  const raw =
    JSON.stringify(
      result,
      null,
      2
    );

  const tickets =
    Array.isArray(result.tickets)
      ? result.tickets
      : [];

  if (result.ok !== true) {

    content.innerHTML = `
      <div class="message">

        <div style="font-size:40px">
          ⚠️
        </div>

        <strong>
          API แจ้งข้อผิดพลาด
        </strong>

        <p>
          ${escapeHtml(
            result.error || 'Unknown error'
          )}
        </p>

        <div class="debug">
          <strong>API RAW RESPONSE</strong>

          <pre style="
            text-align:left;
            white-space:pre-wrap;
            word-break:break-word;
          ">${escapeHtml(raw)}</pre>
        </div>

      </div>
    `;

    return;

  }

  if (tickets.length === 0) {

    content.innerHTML = `
      <div class="message">

        <div style="font-size:42px">
          📭
        </div>

        <strong>
          ยังไม่มี Ticket
        </strong>

        <p style="color:#777">
          ระบบเชื่อมต่อ API สำเร็จ<br>
          แต่ยังไม่พบ Ticket ของ LINE Account นี้
        </p>

      </div>

      <div class="debug">

        <strong>🔎 API RAW RESPONSE</strong>

        <pre style="
          text-align:left;
          white-space:pre-wrap;
          word-break:break-word;
          margin-top:10px;
        ">${escapeHtml(raw)}</pre>

      </div>
    `;

    return;

  }

  content.innerHTML =
    tickets
      .map(createTicketCard)
      .join('');

}

/* =====================================================
   CARD
===================================================== */

function createTicketCard(ticket) {

  const status =
    ticket.status || '-';

  return `

    <div class="ticket">

      <div class="ticket-header">

        <div class="ticket-id">
          🎫 ${escapeHtml(ticket.ticketId)}
        </div>

        <div class="status ${getStatusClass(status)}">
          ${getStatusText(status)}
        </div>

      </div>

      <div class="row">
        <span class="label">📅 วันที่แจ้ง:</span>
        ${escapeHtml(
          formatDate(ticket.createdAt)
        )}
      </div>

      <div class="row">
        <span class="label">🏥 สาขา:</span>
        ${escapeHtml(ticket.branch)}
      </div>

      <div class="row">
        <span class="label">📂 ประเภท:</span>
        ${escapeHtml(ticket.category)}
      </div>

      <div class="row">
        <span class="label">⚠️ Priority:</span>
        ${escapeHtml(ticket.priority)}
      </div>

      <div class="row">
        <span class="label">👨‍💻 ผู้รับผิดชอบ:</span>
        ${escapeHtml(
          ticket.assignee || '-'
        )}
      </div>

      <div class="row">
        <span class="label">⏰ SLA Due:</span>
        ${escapeHtml(
          formatDate(ticket.slaDue)
        )}
      </div>

      <div class="problem">

        <strong>📝 ปัญหา</strong>

        <br><br>

        ${escapeHtml(ticket.problem)}

      </div>

      ${
        ticket.resolution
          ? `
            <div class="problem">

              <strong>🔧 วิธีแก้ไข</strong>

              <br><br>

              ${escapeHtml(
                ticket.resolution
              )}

            </div>
          `
          : ''
      }

    </div>

  `;

}


/* =====================================================
   STATUS
===================================================== */

function getStatusClass(status) {

  switch (status) {

    case 'Open':
      return 'open';

    case 'In Progress':
      return 'progress';

    case 'Pending':
      return 'pending';

    case 'Resolved':
      return 'resolved';

    case 'Closed':
      return 'closed';

    default:
      return 'closed';

  }

}

function getStatusText(status) {

  switch (status) {

    case 'Open':
      return '🟡 เปิดเคส';

    case 'In Progress':
      return '🔵 กำลังดำเนินการ';

    case 'Pending':
      return '🟠 รอดำเนินการ';

    case 'Resolved':
      return '🟢 แก้ไขแล้ว';

    case 'Closed':
      return '✅ ปิดแล้ว';

    default:
      return status || '-';

  }

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value) {

  if (!value) {
    return '-';
  }

  const date =
    new Date(value);

  if (isNaN(date.getTime())) {
    return String(value);
  }

  return date.toLocaleString(
    'th-TH',
    {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }
  );

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

  document.getElementById('content').innerHTML = `

    <div class="message">

      <div style="font-size:40px">
        ⚠️
      </div>

      <strong>
        เกิดข้อผิดพลาด
      </strong>

      <p>
        ${escapeHtml(
          error.message ||
          String(error)
        )}
      </p>

    </div>

  `;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =====================================================
   START
===================================================== */

init();

</script>

</body>
</html>
